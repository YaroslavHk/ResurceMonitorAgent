[package]
name = "ResAgent"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.37.2"
tokio = {version = "1", features = ["full"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
machine-uid = "0.3"
nvml-wrapper = "0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.13"
winapi = { version = "0.3", features = [
    "libloaderapi",  # LoadLibraryA, GetProcAddress, FreeLibrary  (ADL)
    "winnt",         # HANDLE  (PDH)
] }